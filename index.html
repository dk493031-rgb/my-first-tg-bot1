<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Премиум Меню</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Базовые премиум-настройки (темная тема) */
        body {
            background-color: #0b0b0c;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
            padding-bottom: 90px; /* Отступ снизу под кнопку */
        }

        h2 {
            color: #deff9a;
            font-size: 1.2rem;
            margin: 24px 0 12px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-left: 3px solid #deff9a;
            padding-left: 8px;
        }

        /* Сетка 3 на 3 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        /* Стильные карточки товаров */
        .card {
            background: #141416;
            border: 1px solid #232326;
            border-radius: 16px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            transition: all 0.2s ease;
            position: relative;
            cursor: pointer;
            user-select: none;
        }

        /* Эффект при выборе товара */
        .card.selected {
            border-color: #deff9a;
            background: #191c12;
        }

        /* Иконка-стикер */
        .sticker {
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        /* Название товара */
        .title {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 4px;
            color: #f4f4f5;
        }

        /* Цена */
        .price {
            font-size: 0.8rem;
            color: #a1a1aa;
            margin-bottom: 8px;
        }

        /* Выпадающий список вкусов/подтипов */
        select {
            width: 100%;
            background: #232326;
            color: #ffffff;
            border: none;
            padding: 6px;
            border-radius: 8px;
            font-size: 0.75rem;
            outline: none;
            cursor: pointer;
        }

        /* Кастомный чекбокс */
        .checkbox-trigger {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 16px;
            height: 16px;
            accent-color: #deff9a;
            cursor: pointer;
            pointer-events: none; /* Чтобы клик проходил сквозь чекбокс на саму карточку */
        }

        /* Премиальная кнопка внизу экрана */
        .footer-btn {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            background: #deff9a;
            color: #000000;
            border: none;
            padding: 16px;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 700;
            box-shadow: 0 4px 20px rgba(222, 255, 154, 0.2);
            cursor: pointer;
            letter-spacing: 0.5px;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <h2>🥤 Напитки</h2>
    <div class="grid-container">
        <div class="card" onclick="toggleCard(this)">
            <input type="checkbox" class="checkbox-trigger" value="Лимонад" data-price="500">
            <div class="sticker">🍹</div>
            <div class="title">Лимонад</div>
            <div class="price">500 ₸</div>
            <select onclick="event.stopPropagation();"><option>Клубничный</option><option>Апельсиновый</option><option>Мятный</option></select>
        </div>
        <div class="card" onclick="toggleCard(this)">
            <input type="checkbox" class="checkbox-trigger" value="Мохито" data-price="600">
            <div class="sticker">🍸</div>
            <div class="title">Мохито</div>
            <div class="price">600 ₸</div>
            <select onclick="event.stopPropagation();"><option>Классика</option><option>Клубника</option></select>
        </div>
        <div class="card" onclick="toggleCard(this)">
            <input type="checkbox" class="checkbox-trigger" value="Кофе" data-price="700">
            <div class="sticker">☕</div>
            <div class="title">Кофе</div>
            <div class="price">700 ₸</div>
            <select onclick="event.stopPropagation();"><option>Латте</option><option>Капучино</option></select>
        </div>
    </div>

    <h2>🥣 Первые блюда</h2>
    <div class="grid-container">
        <div class="card" onclick="toggleCard(this)">
            <input type="checkbox" class="checkbox-trigger" value="Рамен" data-price="1500">
            <div class="sticker">🍜</div>
            <div class="title">Рамен</div>
            <div class="price">1500 ₸</div>
            <select onclick="event.stopPropagation();"><option>С курицей</option><option>С говядиной</option></select>
        </div>
        <div class="card" onclick="toggleCard(this)">
            <input type="checkbox" class="checkbox-trigger" value="Суп" data-price="1200">
            <div class="sticker">🍲</div>
            <div class="title">Том Ям</div>
            <div class="price">1200 ₸</div>
            <select onclick="event.stopPropagation();"><option>С креветками</option><option>С курицей</option></select>
        </div>
        <div class="card" onclick="toggleCard(this)">
            <input type="checkbox" class="checkbox-trigger" value="Борщ" data-price="1000">
            <div class="sticker">🥣</div>
            <div class="title">Борщ</div>
            <div class="price">1000 ₸</div>
            <select onclick="event.stopPropagation();"><option>Со сметаной</option><option>С зеленью</option></select>
        </div>
    </div>

    <h2>🥩 Вторые блюда</h2>
    <div class="grid-container">
        <div class="card" onclick="toggleCard(this)">
            <input type="checkbox" class="checkbox-trigger" value="Стейк" data-price="2500">
            <div class="sticker">🥩</div>
            <div class="title">Стейк</div>
            <div class="price">2500 ₸</div>
            <select onclick="event.stopPropagation();"><option>Medium</option><option>Well-Done</option></select>
        </div>
        <div class="card" onclick="toggleCard(this)">
            <input type="checkbox" class="checkbox-trigger" value="Бургер" data-price="1800">
            <div class="sticker">🍔</div>
            <div class="title">Бургер</div>
            <div class="price">1800 ₸</div>
            <select onclick="event.stopPropagation();"><option>Классик</option><option>Чизбургер</option></select>
        </div>
        <div class="card" onclick="toggleCard(this)">
            <input type="checkbox" class="checkbox-trigger" value="Пицца" data-price="2200">
            <div class="sticker">🍕</div>
            <div class="title">Пицца</div>
            <div class="price">2200 ₸</div>
            <select onclick="event.stopPropagation();"><option>Пепперони</option><option>Маргарита</option></select>
        </div>
    </div>

    <button class="footer-btn" onclick="sendOrder()">ЗАКАЗ ГОТОВ ✅</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Безопасное переключение состояния карточки
        function toggleCard(card) {
            const checkbox = card.querySelector('.checkbox-trigger');
            checkbox.checked = !checkbox.checked;
            
            if (checkbox.checked) {
                card.classList.add('selected');
            } else {
                card.classList.remove('selected');
            }
        }

        // Корректный сбор информации и отправка
        function sendOrder() {
            let orderItems = [];
            let totalSum = 0;
            
            const checkboxes = document.querySelectorAll('.checkbox-trigger');
            
            checkboxes.forEach(box => {
                if (box.checked) {
                    const card = box.parentElement;
                    const selectValue = card.querySelector('select').value;
                    const price = parseInt(box.getAttribute('data-price'));
                    
                    orderItems.push(`${box.value} (${selectValue})`);
                    totalSum += price;
                }
            });

            if (orderItems.length === 0) {
                alert("Пожалуйста, выберите хотя бы одно блюдо!");
                return;
            }

            const resultData = {
                order: orderItems.join(", "),
                total: totalSum
            };

            // Отправляем JSON боту
            tg.sendData(JSON.stringify(resultData));
        }
    </script>
</body>
</html>
